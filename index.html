<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akan Name Generator</title>

  <!-- Google Fonts for styling text -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Nunito&display=swap" rel="stylesheet"/>

  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Decorative top gradient bar -->
  <div class="top-bar"></div>

  <!-- Background container where floating petals will be added via JS -->
  <div class="petal-bg" id="petal-bg"></div>

  <!-- Navigation bar (top title/logo) -->
  <nav>
    <p class="nav-logo">✦ Akan <span>Name</span> Generator ✦</p>
  </nav>

  <!-- Hero section (main heading) -->
  <header>
    <div class="hero-circle"></div> <!-- decorative circle -->
    <span class="hero-emoji">🌸</span>
    <h1>Discover Your <em>Akan Name</em></h1>

    <!-- Short description -->
    <p class="hero-tagline">
      Enter your birthday and discover your Akan name.
    </p>

    <!-- Small feature badges -->
    <div class="hero-badges">
      <span class="badge">Ghanaian Heritage</span>
      <span class="badge">Day of Birth</span>
      <span class="badge">Soul Names</span>
    </div>
  </header>

  <!-- About section explaining Akan names -->
  <div class="about-section">
    <strong>🌸 About Akan Names</strong>
    Akan names are given based on the day of birth.
  </div>

  <!-- Main content -->
  <main>
    <div class="card">

      <!-- Card header -->
      <div class="card-header">
        <span>⭐</span>
        <div>
          <p>Find Your Name</p>
          <p>Enter your birthday</p>
        </div>
      </div>

      <div class="card-body">

        <!-- Day input -->
        <label>Day</label>
        <input type="number" id="birth-day">

        <!-- Month and Year -->
        <div class="row-two">
          <select id="birth-month">
            <option value="">Month</option>
            <option value="1">January</option>
            <!-- remaining months -->
          </select>

          <input type="number" id="birth-year" placeholder="Year">
        </div>

        <!-- Gender selection -->
        <label>Gender</label>
        <div class="gender-group">
          <button id="btn-male">Male</button>
          <button id="btn-female">Female</button>
        </div>

        <!-- Error messages -->
        <div id="alert-box"></div>

        <!-- Button to generate Akan name -->
        <button id="btn-generate">Reveal My Akan Name</button>

        <!-- Result section (hidden until user clicks generate) -->
        <div id="result-panel">
          <p id="result-name"></p>
          <p id="result-meaning"></p>
          <span id="result-day"></span>

          <!-- Reset button -->
          <button id="btn-reset">Try Again</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="footer-year"></span></p>
  </footer>

  <!-- Bottom decorative bar -->
  <div class="bottom-bar"></div>

  <!-- Link to JavaScript -->
  <script src="script.js"></script>

</body>
</html>
