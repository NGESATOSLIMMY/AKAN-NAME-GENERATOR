<!DOCTYPE html>
<html lang="en">
<head>
  <title>Akan Name Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Akan Name Generator</h1>
  <p>Discover your Ghanaian soul-name based on your birthday.</p>
  <form id="akan-form">

  <!-- Day input -->
  <label for="birth-day">Day of Birth</label>
  <input type="number" id="birth-day" placeholder="e.g. 14" min="1" max="31" />

  <!-- Month input -->
  <label for="birth-month">Month</label>
  <!--select+options give a dropdown menu-->
  <select id="birth-month">
    <option value="">— Select Month —</option>
    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
  </select>

  <!-- Year input -->
  <label for="birth-year">Year</label>
  <input type="number" id="birth-year" placeholder="e.g. 1995" min="1900" max="2026" />

  <!-- Gender -->
  <label>Gender</label>
  <button type="button" id="btn-male">Male</button>
  <button type="button" id="btn-female">Female</button>

  <!-- Submit -->
  <br/><br/>
  <button type="button" id="btn-generate">Find My Akan Name</button>

</form>

<!-- Result shows here -->
<div id="result" style="display:none;">
  <h2>Your Akan Name is: <span id="result-name"></span></h2>
  <p id="result-meaning"></p>
  <p id="result-day"></p>
  <button type="button" id="btn-reset">Try Again</button>
</div>
<script src="script.js" defer></script>
</body>
</html>
