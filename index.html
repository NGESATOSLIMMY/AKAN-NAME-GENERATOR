<!DOCTYPE html>
<html lang="en">
<head>
  <title>Akan Name Generator</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Nunito&display=swap" rel="stylesheet"/>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="top-bar"></div>

  <!-- Petals -->
  <div class="petal-bg" id="petal-bg"></div>

  <!-- Nav -->
  <nav>
    <p class="nav-logo">✦ Akan <span>Name</span> Generator ✦</p>
  </nav>

  <!-- Hero -->
  <header>
    <div class="hero-circle"></div>
    <span class="hero-emoji"></span>

    <h1 style="text-align: center;">Discover Your <em>Akan Name</em></h1>

    <p class="hero-tagline">
      Enter your birthday and discover your Akan name.
    </p>


  </header>

  <!-- About -->
  <div class="about-section">
    <strong > About Akan Names</strong>
    <p>Akan names are given based on the day of birth in Ghanaian culture.</p>
  </div>

  <!-- Main -->
  <main>
    <div class="card">

      <!-- Header -->
      <div class="card-header">
        <span>⭐</span>
        <div>
          <p>Find Your Name</p>
          <small>Enter your birthday</small>
        </div>
      </div>

      <div class="card-body">

        <!-- Day -->
        <label>Day</label>
        <input type="number" id="birth-day" min="1" max="31" placeholder="e.g. 15">

        <!-- Month + Year -->
        <div class="row-two">
          <select id="birth-month">
            <option value="">Month</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>

          <input type="number" id="birth-year" placeholder="Year (e.g. 2005)">
        </div>

        <!-- Gender -->
        <label>Gender</label>
        <div class="gender-group">
          <button type="button" id="btn-male">Male</button>
          <button type="button" id="btn-female">Female</button>
        </div>

        <!-- Alerts -->
        <div id="alert-box"></div>

        <!-- Generate -->
        <button type="button" id="btn-generate">
          Reveal My Akan Name
        </button>

        <!-- Result -->
        <div id="result-panel" class="result-panel">
          <p id="result-name"></p>
          <p id="result-meaning"></p>
          <span id="result-day"></span>

          <button type="button" id="btn-reset">Try Again</button>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="footer-year"></span></p>
  </footer>

  <div class="bottom-bar"></div>

  <script src="script.js"></script>

</body>
</html>
